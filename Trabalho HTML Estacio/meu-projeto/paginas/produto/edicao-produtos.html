<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto - Controle de Estoque</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="produtos.css">
    <script src="../../global.js" defer></script>
</head>
<body>
    <header>
        <h1>Controle de Estoque - Hardware & Periféricos</h1>
        <hr>
    </header>
    <table border="0" width="100%">
        <tr>
            <td valign="top" width="200">
                <nav>
                    <h3>Menu</h3>
                    <ul>
                        <li><a href="produtos.html">Produtos / Estoque</a></li>
                        <li><a href="cadastro-produtos.html">Cadastrar Produto</a></li>
                        <li><a href="edicao-produtos.html">Editar Produto</a></li>
                        <li><a href="../cadastro-categoria/cadastro-categoria.html">Cadastrar Categoria</a></li>
                        <li><a href="../usuario/usuarios.html">Controle de Usuários</a></li>
                        <li><a href="../../index.html">Sair</a></li>
                    </ul>
                </nav>
            </td>
            <td valign="top">
                <main>
                    <h2>Edição de Produto</h2>
                    <form action="produtos.html" method="get">
                        <p>
                            <label for="produto_id">Selecione o Produto para Editar:</label><br>
                            <select id="produto_id" name="produto_id">
                                <option value="1">Mouse Gamer RGB</option>
                                <option value="2">Teclado Mecânico Switch Blue</option>
                                <option value="3">Memória RAM DDR4 16GB</option>
                                <option value="4">Processador Intel</option>
                            </select>
                        </p>
                        <p>
                            <label for="nome">Novo Nome do Produto:</label><br>
                            <input type="text" id="nome" name="nome" value="Mouse Gamer RGB">
                        </p>
                        <p>
                            <label for="quantidade">Atualizar Quantidade:</label><br>
                            <input type="number" id="quantidade" name="quantidade" value="25">
                        </p>
                        <p>
                            <label for="preco">Atualizar Preço (R$):</label><br>
                            <input type="text" id="preco" name="preco" value="150.00">
                        </p>
                        <p>
                            <button type="submit">Salvar Alterações</button>
                        </p>
                    </form>
                </main>
            </td>
        </tr>
    </table>
    <footer>
        <hr>
        <p>&copy; 2026 Loja de Hardware - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
