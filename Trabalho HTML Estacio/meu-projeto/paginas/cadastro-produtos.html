<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto - Controle de Estoque</title>
</head>
<body>
    <header>
        <h1>Controle de Estoque - Hardware & Periféricos</h1>
        <hr>
    </header>
    <table border="0" width="100%">
        <tr>
            <td valign="top" width="200">
                <nav>
                    <h3>Menu</h3>
                    <ul>
                        <li><a href="produtos.html">Produtos / Estoque</a></li>
                        <li><a href="cadastro-produtos.html">Cadastrar Produto</a></li>
                        <li><a href="edicao-produtos.html">Editar Produto</a></li>
                        <li><a href="cadastro-categoria.html">Cadastrar Categoria</a></li>
                        <li><a href="usuarios.html">Controle de Usuários</a></li>
                        <li><a href="../index.html">Sair</a></li>
                    </ul>
                </nav>
            </td>
            <td valign="top">
                <main>
                    <h2>Cadastro de Novo Produto</h2>
                    <form action="produtos.html" method="get">
                        <p>
                            <label for="nome">Nome do Produto:</label><br>
                            <input type="text" id="nome" name="nome" placeholder="Ex: Teclado, Mouse, Processador..." required>
                        </p>
                        <p>
                            <label for="categoria">Categoria:</label><br>
                            <select id="categoria" name="categoria">
                                <option value="perifericos">Periféricos</option>
                                <option value="processadores">Processador</option>
                                <option value="memoria">Memória RAM</option>
                                <option value="computadores">Computadores</option>
                                <option value="outros">Outros</option>
                            </select>
                        </p>
                        <p>
                            <label for="quantidade">Quantidade em Estoque:</label><br>
                            <input type="number" id="quantidade" name="quantidade" min="0" required>
                        </p>
                        <p>
                            <label for="preco">Preço Unitário (R$):</label><br>
                            <input type="text" id="preco" name="preco" placeholder="00.00" required>
                        </p>
                        <p>
                            <label for="imagem_url">URL da Imagem (Link da Internet):</label><br>
                            <input type="url" id="imagem_url" name="imagem_url" placeholder="https://exemplo.com/imagem.jpg">
                        </p>
                        <p>
                            <button type="submit">Cadastrar Produto</button>
                            <button type="reset">Limpar</button>
                        </p>
                    </form>
                </main>
            </td>
        </tr>
    </table>
    <footer>
        <hr>
        <p>&copy; 2026 Loja de Hardware - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
