<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Categoria - Controle de Estoque</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="cadastro-categoria.css">
    <script src="../../global.js" defer></script>
</head>
<body>
    <header>
        <h1>Controle de Estoque - Hardware & Periféricos</h1>
        <hr>
    </header>
    <table border="0" width="100%">
        <tr>
            <td valign="top" width="220">
                <nav>
                    <h3>Menu</h3>
                    <ul>
                        <li><a href="../produto/produtos.html">Produtos / Estoque</a></li>
                        <li><a href="../produto/cadastro-produtos.html">Cadastrar Produto</a></li>
                        <li><a href="../produto/edicao-produtos.html">Editar Produto</a></li>
                        <li><a href="cadastro-categoria.html">Cadastrar Categoria</a></li>
                        <li><a href="../usuario/usuarios.html">Controle de Usuários</a></li>
                        <li><a href="../../index.html">Sair</a></li>
                    </ul>
                </nav>
            </td>
            <td valign="top">
                <main>
                    <h2>Cadastro de Nova Categoria</h2>
                    <form action="../produto/produtos.html" method="get">
                        <p>
                            <label for="nome_categoria">Nome da Categoria:</label><br>
                            <input type="text" id="nome_categoria" name="nome_categoria" placeholder="Ex: Placas de Vídeo, Gabinetes..." required>
                        </p>
                        <p>
                            <label for="descricao">Descrição:</label><br>
                            <textarea id="descricao" name="descricao" rows="4" cols="40" placeholder="Breve descrição da categoria..."></textarea>
                        </p>
                        <p>
                            <button type="submit">Salvar Categoria</button>
                            <button type="reset">Limpar</button>
                        </p>
                    </form>
                </main>
            </td>
        </tr>
    </table>
    <footer>
        <hr>
        <p>&copy; 2026 Loja de Hardware - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
