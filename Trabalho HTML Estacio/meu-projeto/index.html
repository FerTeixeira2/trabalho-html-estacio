<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Controle de Estoque</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="login.css">
    <script src="global.js" defer></script>
</head>
<body class="pagina-login">
    <header>
        <h1>Controle de Estoque - Hardware & Periféricos</h1>
        <hr>
    </header>
    <main class="login-panel">
        <h2>Acesso ao Sistema</h2>
        <form class="login-form" action="paginas/produto/produtos.html" method="get">
            <p>
                <label for="usuario">Usuário / E-mail:</label>
                <input type="text" id="usuario" name="usuario" required>
            </p>
            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </p>
            <p>
                <button type="submit">Entrar</button>
            </p>
        </form>
    </main>
    <footer>
        <hr>
        <p>&copy; 2026 Loja de Hardware - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
